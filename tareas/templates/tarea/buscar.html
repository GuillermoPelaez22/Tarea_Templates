{% extends 'principal.html' %}

{% block cabecera %}
    <h1>Tareas que contienen "{{ texto }}" en el título o la descripción</h1>
{% endblock %}

{% block contenido %}
    {% for t in tareas %}
        {% include 'tarea/tarea.html' %}
    {% empty %}
        <p>No hay tareas que contengan ese texto.</p>
    {% endfor %}
{% endblock %}
