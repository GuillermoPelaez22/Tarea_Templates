{% extends 'principal.html' %}

{% block cabecera %}
    <h1>Tareas completadas entre {{ anyo_inicio }} y {{ anyo_fin }}</h1>
{% endblock %}

{% block contenido %}
    {% for t in tareas %}
        {% include 'tarea/tarea.html' %}
    {% empty %}
        <p>No hay tareas completadas en ese periodo.</p>
    {% endfor %}
{% endblock %}
